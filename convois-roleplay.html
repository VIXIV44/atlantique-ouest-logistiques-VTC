<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convois RolePlay | AOL</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --aol-vibrant-cyan: #00f2ff; 
            --aol-glow-cyan: rgba(0, 242, 255, 0.25); 
            --aol-silver: #f3f4f6; 
            --aol-text-muted: #8e9bb0; 
            --aol-deep-space: #060913; 
            --aol-card-bg: rgba(15, 23, 42, 0.3); 
            --aol-card-border: rgba(0, 242, 255, 0.15); 
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            background-color: var(--aol-deep-space); 
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 242, 255, 0.09), transparent 60%); 
            color: var(--aol-silver); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header { 
            display: flex; 
            align-items: center; 
            padding: 25px 6%; 
            background: rgba(6, 9, 19, 0.8); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(0, 242, 255, 0.1); 
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100; 
        }
        
        .btn-retour { 
            color: #fff; text-decoration: none; font-weight: 700; font-size: 0.85rem; 
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; 
            gap: 10px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .btn-retour:hover { color: var(--aol-vibrant-cyan); text-shadow: 0 0 12px var(--aol-glow-cyan); transform: translateX(-3px); }

        .page-galerie { padding: 160px 6% 40px 6%; max-width: 1400px; margin: 0 auto; flex: 1; width: 100%; box-sizing: border-box; }
        
        .titre-zone { text-align: center; margin-bottom: 50px; }
        .titre-zone h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.5rem, 5vw, 3.8rem); text-transform: uppercase; margin: 0 0 15px 0; color: #fff; letter-spacing: -1px; }
        .titre-zone h1 span { color: var(--aol-vibrant-cyan); text-shadow: 0 0 30px rgba(0, 242, 255, 0.4); filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.2)); }
        .titre-zone p { color: var(--aol-text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6; }

        /* GRILLE ET STYLE DES PHOTOS SANS TEXTE */
        .photo-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 25px; 
            margin-top: 20px; 
        }
        
        .photo-item { 
            background: var(--aol-card-bg); 
            border: 1px solid var(--aol-card-border); 
            border-radius: 12px; 
            overflow: hidden; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
            aspect-ratio: 16 / 9; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            cursor: pointer;
        }
        
        .photo-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease; 
        }
        
        .photo-item:hover { 
            border-color: var(--aol-vibrant-cyan); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.25); 
            transform: translateY(-5px); 
        }
        
        .photo-item:hover img { 
            transform: scale(1.06); 
        }

        /* MODALE PLEIN ÉCRAN (LIGHTBOX) */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 14, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 200;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 85%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 242, 255, 0.15);
            border: 1px solid rgba(0, 242, 255, 0.2);
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px; right: 40px;
            color: #fff; font-size: 2.5rem; font-weight: 300;
            cursor: pointer; transition: 0.2s;
            user-select: none;
        }

        .lightbox-close:hover {
            color: var(--aol-vibrant-cyan);
            transform: scale(1.1);
        }

        footer { text-align: center; padding: 40px; font-size: 0.75rem; color: #4b5563; border-top: 1px solid rgba(255, 255, 255, 0.04); text-transform: uppercase; margin-top: 60px; }
        
        @media (max-width: 768px) {
            .photo-grid { grid-template-columns: 1fr; }
            .lightbox-close { top: 20px; right: 20px; font-size: 2rem; }
            .lightbox-content { max-width: 95%; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="btn-retour">← Retour à l'accueil</a>
</header>

<main class="page-galerie">
    <div class="titre-zone">
        <h1>Convois <span>RolePlay</span></h1>
        <p>Immersion totale, respect du code de la route et réalisme extrême en livraison de fret.</p>
    </div>

    <div class="photo-grid">
        
        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay1.jpg" alt="Photo RP 1">
        </div>

        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay2.jpg" alt="Photo RP 2">
        </div>

        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay3.jpg" alt="Photo RP 3">
        </div>

        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay4.jpg" alt="Photo RP 4">
        </div>

        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay5.jpg" alt="Photo RP 5">
        </div>

        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay6.jpg" alt="Photo RP 6">
        </div>

        <div class="photo-item" onclick="openLightbox(this)">
            <img src="roleplay7.jpg" alt="Photo RP 7">
        </div>

    </div>
</main>

<div class="lightbox" id="lightboxView" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightboxImg" src="" alt="Aperçu Grand Format" onclick="event.stopPropagation()">
</div>

<footer>ATLANTIQUE OUEST LOGISTIQUES © 2026 - Tous droits réservés.</footer>

<script>
    const lightbox = document.getElementById('lightboxView');
    const lightboxImg = document.getElementById('lightboxImg');

    function openLightbox(element) {
        const imgSrc = element.querySelector('img').src;
        lightboxImg.src = imgSrc;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }
</script>
</body>
</html>
